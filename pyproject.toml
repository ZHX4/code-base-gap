[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-base-gap"
version = "0.1.0"
description = "Autonomous repository auditor"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "ZHX4"}]
dependencies = []

[project.scripts]
code-base-gap = "code_base_gap.phase2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
