[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-base-gap"
version = "0.1.0"
description = "Autonomous repository auditor"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "ZHX4"}]
dependencies = [
  "tree-sitter>=0.26.0,<0.27.0",
  "tree-sitter-language-pack==1.13.3",
]

[project.scripts]
code-base-gap = "code_base_gap.phase2.cli:main"
code-base-gap-parse = "code_base_gap.phase3.cli:main"
code-base-gap-graph = "code_base_gap.phase4.cli:main"
code-base-gap-scan = "code_base_gap.phase5.cli:main"
code-base-gap-reconstruct = "code_base_gap.phase6.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_base_gap*"]
